# Stack de DÉVELOPPEMENT local : db + app + proxy, port exposé sur l'hôte.
name: portfoliobuilder-dev

networks:
  pb-net:
    driver: bridge

volumes:
  pb-pgdata-dev:

services:
  pb-database:
    image: postgres:17-alpine
    container_name: pb-database-dev
    restart: unless-stopped
    networks:
      - pb-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_builder}
      POSTGRES_USER: ${POSTGRES_USER:-pb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - pb-pgdata-dev:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pb_user} -d ${POSTGRES_DB:-portfolio_builder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pb-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfoliobuilder-app:dev
    container_name: pb-app-dev
    restart: unless-stopped
    networks:
      - pb-net
    depends_on:
      pb-database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "10000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-pb_user}:${POSTGRES_PASSWORD}@pb-database:5432/${POSTGRES_DB:-portfolio_builder}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      NEUTRALIZE_EMAIL: ${NEUTRALIZE_EMAIL:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-PortfolioBuilder}
      SMTP_SECURE: ${SMTP_SECURE:-false}

  pb-proxy:
    image: nginx:alpine
    container_name: pb-proxy-dev
    restart: unless-stopped
    networks:
      - pb-net
    depends_on:
      pb-app:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
