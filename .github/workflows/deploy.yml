name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Tests et Analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Suite de tests (unit + intégration, base éphémère)
        run: docker compose -f docker-utils.yaml run --rm test

      - name: Nettoyage des conteneurs de test
        if: always()
        run: docker compose -f docker-utils.yaml down -v

  # ── Déploiement continu : seulement si les tests passent, sur main ─
  deploy:
    name: Déploiement (VPS)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/claudeuser/PortfolioBuilder
            bash deploy.sh
